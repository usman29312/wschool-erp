<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Waseem Science & Commerce Academy ERP</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, rgba(24, 87, 166, 0.9) 0%, rgba(15, 58, 117, 0.95) 100%), 
                  url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?q=80&w=1470&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      border: 2px solid var(--gold-color);
      width: 100%;
      max-width: 450px;
      padding: 3rem 2.5rem;
      animation: fadeInUp 0.6s ease-out;
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .login-logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid var(--gold-color);
      object-fit: cover;
      margin-bottom: 1rem;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.25rem rgba(24, 87, 166, 0.25);
    }
    .btn-login {
      background: linear-gradient(135deg, var(--primary-color) 0%, #0F3A75 100%);
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.75rem;
      border-radius: 8px;
      transition: all 0.3s;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #0F3A75 0%, var(--primary-color) 100%);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(24, 87, 166, 0.3);
    }
    .role-btn-group input[type="radio"] {
      display: none;
    }
    .role-btn-group label {
      flex: 1;
      text-align: center;
      padding: 0.5rem;
      border: 1px solid var(--gray-border);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .role-btn-group label:first-of-type {
      border-top-left-radius: 8px;
      border-bottom-left-radius: 8px;
    }
    .role-btn-group label:last-of-type {
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
    }
    .role-btn-group input[type="radio"]:checked + label {
      background-color: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }
  </style>
</head>
<body>

  <div class="login-container text-center">
    <!-- Logo -->
    <img src="/img/logo.png" alt="Academy Logo" class="login-logo">
    
    <!-- Branding Header -->
    <h3 class="fw-bold mb-1" style="color: var(--primary-color);">Waseem Academy</h3>
    <p class="text-uppercase text-muted fw-bold mb-4" style="font-size: 0.75rem; letter-spacing: 2px;">
      Learning Today, Leading Tomorrow
    </p>

    <!-- Error Placeholder -->
    <div id="errorAlert" class="alert alert-danger d-none" role="alert">
      <i class="fa-solid fa-triangle-exclamation me-2"></i>
      <span id="errorMessage"></span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" novalidate>
      
      <!-- Role Selection -->
      <div class="mb-4">
        <label class="form-label d-block text-start text-muted fw-semibold mb-2" style="font-size: 0.85rem;">Select Role</label>
        <div class="d-flex role-btn-group">
          <input type="radio" id="roleAdmin" name="role" value="admin" checked>
          <label for="roleAdmin"><i class="fa-solid fa-user-shield me-2"></i>Admin</label>

          <input type="radio" id="roleTeacher" name="role" value="teacher">
          <label for="roleTeacher"><i class="fa-solid fa-chalkboard-user me-2"></i>Teacher</label>
        </div>
      </div>

      <!-- Email Field -->
      <div class="mb-3 text-start">
        <label for="email" class="form-label text-muted fw-semibold" style="font-size: 0.85rem;">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="fa-solid fa-envelope text-muted"></i></span>
          <input type="text" class="form-control" id="email" placeholder="yourname" required autocomplete="username">
          <span class="input-group-text bg-light text-muted fw-semibold" style="font-size:0.9rem;">@waseem.edu.pk</span>
        </div>
      </div>

      <!-- Password Field -->
      <div class="mb-3 text-start">
        <label for="password" class="form-label text-muted fw-semibold" style="font-size: 0.85rem;">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
          <input type="password" class="form-control border-end-0" id="password" placeholder="••••••••" required>
          <button class="btn btn-outline-secondary border-start-0 bg-white text-muted" type="button" id="togglePassword" style="border: 1px solid #dee2e6;">
            <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
          </button>
        </div>
      </div>

      <!-- Forgot Password Link -->
      <div class="mb-4 text-end">
        <a href="/forgot-password.html" class="text-decoration-none fw-semibold" style="color: var(--primary-color); font-size: 0.85rem;">
          Forgot Password?
        </a>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-login w-100" id="loginBtn">
        <span id="btnText"><i class="fa-solid fa-right-to-bracket me-2"></i>Log In</span>
        <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
      </button>

    </form>
  </div>

  <!-- Client-Side Authorization Logic -->
  <script src="/js/auth.js"></script>
</body>
</html>
